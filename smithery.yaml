startCommand:
    type: stdio
    configSchema:
        # JSON Schema defining the configuration options for the MCP.
        type: object
        properties:
            integratorApiKey:
                type: string
                description: You can generate an API key in your Integrator profile.
            integratorTeamId:
                type: string
                description: You can find the Team ID in the URL of the Team page.
    commandFunction:
        # A function that produces the CLI command to start the MCP on stdio.
        |-
        (config) => ({
          "command": "node",
          "args": [
            "build/index.js"
          ],
          "env": {
            INTEGRATOR_API_KEY: config.integratorApiKey,
            INTEGRATOR_TEAM: config.integratorTeamId
          }
        })
